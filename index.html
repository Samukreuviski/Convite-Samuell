<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Samuell 20 Anos</title>
    
    <!-- Fontes Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --navy-dark: #020610; 
            --navy-main: #051024; 
            --gold: #C5A059;      
            --white: #F0F2F5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--navy-dark);
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        #particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(160deg, rgba(5,16,36,0.85), rgba(2,6,16,0.98));
            border: 1px solid rgba(197, 160, 89, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel', serif;
            font-size: 20rem;
            color: var(--navy-main);
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
            animation: pulseSlow 8s infinite alternate;
        }

        .header { text-align: center; }
        
        .sub-title {
            color: var(--gold);
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.8s;
        }

        .line-wrapper {
            width: 1px; height: 50px;
            background: rgba(255,255,255,0.05);
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.2s;
        }
        .line-inner {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--gold), transparent);
            animation: dropLine 3s infinite;
        }

        .date-container { text-align: center; opacity: 0; animation: fadeInUp 1s ease forwards 1.4s; }
        
        .big-date {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            color: var(--white);
            line-height: 1;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }
        
        .month-year {
            color: var(--gold);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .time-row {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 10px;
            color: #94a3b8;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
        }

        .footer {
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.8s;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .location-name {
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: white;
        }

        /* Botão Principal Dourado */
        .btn-share-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 90%;
            padding: 16px;
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }
        
        .btn-share-group:hover {
            background: var(--gold);
            color: var(--navy-dark);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
            transform: translateY(-2px);
        }

        .map-link {
            color: #64748b; font-size: 0.65rem; text-decoration: none; letter-spacing: 1px;
            display: flex; align-items: center; gap: 5px; margin-top: 5px;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes dropLine { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        @keyframes pulseSlow { 0% { opacity: 0.2; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.05); } }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="card">
        <div class="watermark">XX</div>

        <div class="header">
            <div class="sub-title">Convite Especial</div>
            <h1>Samuell</h1>
        </div>

        <div class="line-wrapper"><div class="line-inner"></div></div>

        <div class="date-container">
            <div class="big-date">21</div>
            <div class="month-year">Janeiro</div>
            <div class="time-row">
                <i data-lucide="calendar" width="14"></i> QUARTA-FEIRA
                <span style="color:var(--gold)">•</span>
                <i data-lucide="clock" width="14"></i> 20H00
            </div>
        </div>

        <div class="footer">
            <div>
                <p class="location-name">Pizzaria Tropical - T2</p>
                <a href="https://www.google.com/maps/search/?api=1&query=Pizzaria+Tropical+T2" target="_blank" class="map-link">
                    VER NO MAPA <i data-lucide="external-link" width="10"></i>
                </a>
            </div>

            <!-- Botão Único de Compartilhamento -->
            <button onclick="compartilhar()" class="btn-share-group">
                Mandar no Grupo <i data-lucide="share-2" width="16"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function compartilhar() {
            // Pega o link atual onde o site está hospedado
            const urlConvite = window.location.href;
            const textoConvite = `Você está convidado para os 20 anos do Samuell!\n📅 21 de Janeiro\n📍 Pizzaria Tropical - T2\n\nConfira o convite:`;

            // 1. Tenta usar o compartilhamento Nativo do celular (iPhone/Android Moderno)
            if (navigator.share) {
                navigator.share({
                    title: 'Convite Samuell 20 Anos',
                    text: textoConvite,
                    url: urlConvite,
                })
                .then(() => console.log('Compartilhado com sucesso'))
                .catch((error) => console.log('Erro ao compartilhar', error));
            } 
            // 2. Fallback: Se não suportar (PC ou celular antigo), abre o WhatsApp direto
            else {
                const textoCompleto = `${textoConvite} ${urlConvite}`;
                // window.location.href é mais seguro que window.open para iOS
                window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoCompleto)}`;
            }
        }

        // --- Visual: Partículas ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.5 - 0.25; this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > width) this.x = 0; if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0; if (this.y < 0) this.y = height;
            }
            draw() {
                ctx.fillStyle = `rgba(197, 160, 89, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function init() { particles = []; for (let i = 0; i < 60; i++) particles.push(new Particle()); }
        function animate() { ctx.clearRect(0, 0, width, height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }

        window.addEventListener('resize', resize); resize(); init(); animate();
    </script>
</body>
</html>
