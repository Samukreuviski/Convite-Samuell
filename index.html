<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Samuell 20 Anos</title>
    
    <!-- Fontes Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@200;300;400;600&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --navy-dark: #020610;
            --navy-main: #051024;
            --gold: #C5A059;
            --gold-glow: rgba(197, 160, 89, 0.6);
            --white: #F0F2F5;
            --tech-blue: rgba(100, 200, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--navy-dark);
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas das Partículas (Fundo) */
        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.6; /* Aumentei a visibilidade */
        }

        /* Efeito de Scanline (Linha de Scanner) */
        .scanline {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(197, 160, 89, 0.05) 51%, transparent 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.3;
        }
        
        .scanner-bar {
            position: fixed;
            top: -10%; left: 0;
            width: 100%; height: 20px;
            background: linear-gradient(to bottom, transparent, var(--gold-glow), transparent);
            opacity: 0.3;
            z-index: 21;
            animation: scan 6s linear infinite;
            pointer-events: none;
        }

        /* Container Principal */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            /* Altura dinâmica para caber em qualquer celular */
            height: auto;
            min-height: 500px;
            padding: 2px; /* Espaço para a borda brilhante */
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.3), transparent 40%, transparent 60%, rgba(197, 160, 89, 0.3));
            border-radius: 2px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* O Cartão Interno */
        .card {
            background: rgba(2, 6, 16, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 100%; height: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.1);
        }

        /* Elementos HUD (Cantoneiras Tecnológicas) */
        .hud-corner {
            position: absolute;
            width: 20px; height: 20px;
            border-color: var(--gold);
            border-style: solid;
            transition: all 0.5s ease;
            opacity: 0.8;
        }
        .tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
        .bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        /* Decoração Tech Lateral */
        .tech-line {
            position: absolute;
            background: var(--gold);
            opacity: 0.3;
        }
        .line-left { left: 0; top: 50%; width: 3px; height: 40px; transform: translateY(-50%); }
        .line-right { right: 0; top: 50%; width: 3px; height: 40px; transform: translateY(-50%); }

        /* Tipografia e Conteúdo */
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        
        .sub-title {
            font-family: 'Rajdhani', sans-serif;
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 500;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1;
            margin: 10px 0;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255,255,255,0.1);
            position: relative;
        }

        /* Efeito Glitch sutil no nome */
        h1::before, h1::after {
            content: 'Samuell';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--navy-dark);
            opacity: 0.5;
            display: none;
        }

        /* Dados do Evento */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            text-align: center;
            margin: 20px 0;
            font-family: 'Rajdhani', sans-serif;
        }

        .big-date {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            color: var(--white);
            line-height: 1;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            margin-bottom: 5px;
        }
        
        .month {
            color: var(--gold);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-size: 1rem;
            font-weight: 700;
        }

        .info-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #a8b2c1;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding: 10px 0;
            margin-top: 10px;
        }

        /* Botão Tech */
        .btn-tech {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 15px 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-tech:hover {
            background: var(--gold);
            color: var(--navy-dark);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.4);
        }

        .btn-tech::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        
        .btn-tech:hover::before { left: 100%; }

        /* Animações */
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Classes utilitárias para Typewriter */
        .typewriter-text {
            border-right: 2px solid var(--gold);
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink { 50% { border-color: transparent; } }

        /* Ajustes Mobile */
        @media (max-width: 400px) {
            h1 { font-size: 3rem; }
            .big-date { font-size: 4.5rem; }
            .card-container { width: 95%; border: none; box-shadow: none; background: transparent; }
            .card { background: rgba(2, 6, 16, 0.6); border: none; padding: 30px 10px; }
            /* No mobile, removemos bordas pesadas para dar ar */
        }
    </style>
</head>
<body>

    <!-- Scanner e Partículas -->
    <canvas id="particles"></canvas>
    <div class="scanline"></div>
    <div class="scanner-bar"></div>

    <div class="card-container">
        <div class="card">
            <!-- HUD Decorativo -->
            <div class="hud-corner tl"></div>
            <div class="hud-corner tr"></div>
            <div class="hud-corner bl"></div>
            <div class="hud-corner br"></div>
            <div class="tech-line line-left"></div>
            <div class="tech-line line-right"></div>

            <div class="header">
                <div class="sub-title" id="type-subtitle"></div>
                <h1>Samuell</h1>
                <div style="height: 1px; width: 50px; background: var(--gold); margin: 10px auto;"></div>
            </div>

            <div class="data-grid">
                <div>
                    <div class="big-date">21</div>
                    <div class="month">Janeiro</div>
                </div>
                
                <div class="info-row">
                    <i data-lucide="calendar" width="16"></i> <span id="type-day"></span>
                </div>
                <div class="info-row" style="border-top: none;">
                    <i data-lucide="clock" width="16"></i> <span id="type-time"></span>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <p style="font-size: 0.7rem; color: #64748b; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px;">Localização Identificada</p>
                <p style="font-size: 1rem; color: white; letter-spacing: 2px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; font-weight: 700;">Pizzaria Tropical - T2</p>
            </div>

            <a href="https://www.google.com/maps/search/?api=1&query=Pizzaria+Tropical+T2" target="_blank" class="btn-tech">
                Ver no Mapa <i data-lucide="map" width="16"></i>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- 1. SCRIPT DE PARTÍCULAS OTIMIZADO MOBILE ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles(); // Reinicia para ajustar densidade
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8; // Mais rápido
                this.vy = (Math.random() - 0.5) * 0.8;
                this.size = Math.random() * 2 + 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(197, 160, 89, 0.8)'; // Mais visível
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            // Densidade maior para mobile
            const count = window.innerWidth < 600 ? 70 : 100;
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            
            // Desenha linhas de conexão
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx*dx + dy*dy);

                    // Distância de conexão maior no mobile para garantir que apareçam
                    const maxDist = window.innerWidth < 600 ? 100 : 150;

                    if (distance < maxDist) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(197, 160, 89, ${0.3 - distance/maxDist})`; // Linhas mais fortes
                        ctx.lineWidth = 0.8; // Linhas mais grossas
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        // --- 2. EFEITO TYPEWRITER (DIGITAÇÃO) ---
        function typeWriter(elementId, text, speed = 100, delay = 0) {
            setTimeout(() => {
                const element = document.getElementById(elementId);
                element.classList.add('typewriter-text');
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        element.classList.remove('typewriter-text'); // Para de piscar o cursor no fim
                    }
                }
                type();
            }, delay);
        }

        // Inicialização
        window.addEventListener('resize', resize);
        resize(); // Chama resize logo de cara
        animateParticles();

        // Dispara as digitações em sequência
        window.onload = () => {
            typeWriter("type-subtitle", "CONVITE ESPECIAL", 100, 500);
            typeWriter("type-day", "QUARTA-FEIRA", 100, 2000);
            typeWriter("type-time", "20H00", 100, 3500);
        };

    </script>
</body>
</html>
